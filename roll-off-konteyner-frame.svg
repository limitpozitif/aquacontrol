<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0b3d66"/>
    </marker>
  </defs>

  <rect width="1000" height="720" fill="#f4f7fb"/>

  <!-- ===== TITLE ===== -->
  <text x="40" y="46" font-size="26" font-weight="700" fill="#0b3d66">ROLL-OFF KONTEYNER — ÇERÇEVE (SAÇSIZ) YAPISI</text>
  <text x="42" y="70" font-size="14" fill="#44546a">Kaynaklı iskelet: şase rayları + enine kirişler + köşe/ara kolonlar + üst başlık + kanca çubuğu · Sac kaplama hariç</text>

  <!-- ===== İZOMETRİK İSKELET ===== -->
  <text x="245" y="112" font-size="14" font-weight="700" fill="#0b3d66" text-anchor="middle">İZOMETRİK İSKELET</text>

  <!-- far (arka) elemanlar - kesikli -->
  <line x1="57" y1="315" x2="317" y2="465" stroke="#9db4c8" stroke-width="4" stroke-dasharray="8 5"/>
  <line x1="317" y1="465" x2="430" y2="400" stroke="#9db4c8" stroke-width="3.5" stroke-dasharray="8 5"/>
  <line x1="317" y1="465" x2="317" y2="345" stroke="#9db4c8" stroke-width="3.5" stroke-dasharray="8 5"/>
  <line x1="57" y1="205" x2="317" y2="345" stroke="#9db4c8" stroke-width="4" stroke-dasharray="8 5"/>
  <line x1="430" y1="280" x2="317" y2="345" stroke="#9db4c8" stroke-width="3.5" stroke-dasharray="8 5"/>
  <line x1="143" y1="365" x2="143" y2="245" stroke="#9db4c8" stroke-width="3" stroke-dasharray="8 5"/>
  <line x1="229" y1="414" x2="229" y2="294" stroke="#9db4c8" stroke-width="3" stroke-dasharray="8 5"/>

  <!-- enine kirişler (travers) -->
  <line x1="170" y1="250" x2="57" y2="315" stroke="#5b7a99" stroke-width="4"/>
  <line x1="235" y1="288" x2="122" y2="353" stroke="#5b7a99" stroke-width="3"/>
  <line x1="300" y1="325" x2="187" y2="390" stroke="#5b7a99" stroke-width="3"/>
  <line x1="365" y1="363" x2="252" y2="428" stroke="#5b7a99" stroke-width="3"/>

  <!-- yakın (ön) elemanlar - sağlam -->
  <line x1="170" y1="250" x2="430" y2="400" stroke="#24598b" stroke-width="7" stroke-linecap="round"/>
  <line x1="170" y1="250" x2="170" y2="130" stroke="#24598b" stroke-width="4"/>
  <line x1="430" y1="400" x2="430" y2="280" stroke="#24598b" stroke-width="4"/>
  <line x1="57" y1="315" x2="57" y2="205" stroke="#24598b" stroke-width="4"/>
  <line x1="256" y1="300" x2="256" y2="180" stroke="#24598b" stroke-width="3.5"/>
  <line x1="342" y1="349" x2="342" y2="229" stroke="#24598b" stroke-width="3.5"/>
  <line x1="170" y1="130" x2="430" y2="280" stroke="#24598b" stroke-width="4.5"/>
  <!-- kanca çubuğu (ön üst) -->
  <line x1="170" y1="130" x2="57" y2="205" stroke="#b03a2e" stroke-width="9" stroke-linecap="round"/>

  <!-- etiketler -->
  <text x="290" y="372" font-size="11" fill="#1f4e79">ana kızak rayı</text>
  <text x="132" y="342" font-size="11" fill="#1f4e79">enine kiriş (travers)</text>
  <text x="24" y="260" font-size="11" fill="#1f4e79">köşe kolonu</text>
  <text x="338" y="244" font-size="11" fill="#1f4e79">üst başlık</text>
  <text x="96" y="158" font-size="11" fill="#7a2020">kanca çubuğu</text>
  <text x="452" y="300" font-size="11" fill="#44546a">arka kapı çerçevesi</text>
  <text x="245" y="482" font-size="12" font-weight="700" fill="#0b3d66" text-anchor="middle">İSKELE (SAÇSIZ)</text>

  <!-- ölçüler iso -->
  <line x1="182" y1="296" x2="442" y2="446" stroke="#0b3d66" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="325" y="500" font-size="12" fill="#0b3d66" text-anchor="middle">6.000 mm (uzunluk)</text>
  <line x1="42" y1="332" x2="42" y2="218" stroke="#0b3d66" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="33" y="278" font-size="12" fill="#0b3d66" transform="rotate(-90 33 278)" text-anchor="middle">2.200 mm</text>

  <!-- ===== ŞASE PLANI (üstten) ===== -->
  <text x="570" y="505" font-size="14" font-weight="700" fill="#0b3d66" text-anchor="middle">ŞASE PLANI (üstten)</text>
  <rect x="420" y="520" width="300" height="125" fill="none" stroke="#9db4c8" stroke-width="2" stroke-dasharray="7 4"/>
  <line x1="424" y1="560" x2="716" y2="560" stroke="#24598b" stroke-width="6" stroke-linecap="round"/>
  <line x1="424" y1="625" x2="716" y2="625" stroke="#24598b" stroke-width="6" stroke-linecap="round"/>
  <line x1="445" y1="560" x2="445" y2="625" stroke="#5b7a99" stroke-width="3"/>
  <line x1="490" y1="560" x2="490" y2="625" stroke="#5b7a99" stroke-width="3"/>
  <line x1="535" y1="560" x2="535" y2="625" stroke="#5b7a99" stroke-width="3"/>
  <line x1="580" y1="560" x2="580" y2="625" stroke="#5b7a99" stroke-width="3"/>
  <line x1="625" y1="560" x2="625" y2="625" stroke="#5b7a99" stroke-width="3"/>
  <line x1="670" y1="560" x2="670" y2="625" stroke="#5b7a99" stroke-width="3"/>
  <line x1="695" y1="560" x2="695" y2="625" stroke="#5b7a99" stroke-width="3"/>
  <rect x="420" y="520" width="7" height="7" fill="#24598b"/>
  <rect x="713" y="520" width="7" height="7" fill="#24598b"/>
  <rect x="420" y="638" width="7" height="7" fill="#24598b"/>
  <rect x="713" y="638" width="7" height="7" fill="#24598b"/>
  <rect x="570" y="520" width="7" height="7" fill="#5b7a99"/>
  <rect x="570" y="638" width="7" height="7" fill="#5b7a99"/>
  <line x1="428" y1="516" x2="712" y2="516" stroke="#b03a2e" stroke-width="8" stroke-linecap="round"/>
  <text x="570" y="510" font-size="10" fill="#7a2020" text-anchor="middle">kanca çubuğu</text>
  <text x="435" y="596" font-size="10" fill="#1f4e79">şase rayları</text>
  <text x="600" y="612" font-size="10" fill="#1f4e79">enine kirişler</text>
  <text x="470" y="528" font-size="10" fill="#44546a">köşe kolonları</text>
  <line x1="420" y1="655" x2="720" y2="655" stroke="#0b3d66" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="570" y="673" font-size="12" fill="#0b3d66" text-anchor="middle">6.000 mm</text>
  <line x1="725" y1="520" x2="725" y2="645" stroke="#0b3d66" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="736" y="585" font-size="12" fill="#0b3d66" transform="rotate(-90 736 585)" text-anchor="middle">2.500 mm</text>

  <!-- ===== YAN İSKELET ===== -->
  <text x="210" y="505" font-size="14" font-weight="700" fill="#0b3d66" text-anchor="middle">YAN İSKELET</text>
  <line x1="60" y1="640" x2="360" y2="640" stroke="#24598b" stroke-width="6" stroke-linecap="round"/>
  <line x1="60" y1="530" x2="360" y2="530" stroke="#24598b" stroke-width="6" stroke-linecap="round"/>
  <line x1="60" y1="530" x2="60" y2="640" stroke="#24598b" stroke-width="4"/>
  <line x1="110" y1="530" x2="110" y2="640" stroke="#5b7a99" stroke-width="3"/>
  <line x1="160" y1="530" x2="160" y2="640" stroke="#5b7a99" stroke-width="3"/>
  <line x1="210" y1="530" x2="210" y2="640" stroke="#5b7a99" stroke-width="3"/>
  <line x1="260" y1="530" x2="260" y2="640" stroke="#5b7a99" stroke-width="3"/>
  <line x1="310" y1="530" x2="310" y2="640" stroke="#5b7a99" stroke-width="3"/>
  <line x1="360" y1="530" x2="360" y2="640" stroke="#24598b" stroke-width="4"/>
  <line x1="60" y1="640" x2="110" y2="530" stroke="#5b7a99" stroke-width="2"/>
  <line x1="60" y1="530" x2="110" y2="640" stroke="#5b7a99" stroke-width="2"/>
  <line x1="210" y1="640" x2="260" y2="530" stroke="#5b7a99" stroke-width="2"/>
  <line x1="210" y1="530" x2="260" y2="640" stroke="#5b7a99" stroke-width="2"/>
  <line x1="57" y1="530" x2="57" y2="560" stroke="#b03a2e" stroke-width="7" stroke-linecap="round"/>
  <line x1="360" y1="530" x2="360" y2="640" stroke="#24598b" stroke-width="6"/>
  <text x="68" y="520" font-size="10" fill="#7a2020">kanca</text>
  <text x="200" y="522" font-size="10" fill="#1f4e79" text-anchor="middle">üst başlık</text>
  <text x="200" y="650" font-size="10" fill="#1f4e79" text-anchor="middle">ana kızak rayı</text>
  <text x="128" y="588" font-size="10" fill="#44546a">kolonlar</text>
  <text x="356" y="522" font-size="10" fill="#44546a" text-anchor="end">arka kapı çerçevesi</text>
  <line x1="60" y1="668" x2="360" y2="668" stroke="#0b3d66" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="210" y="686" font-size="12" fill="#0b3d66" text-anchor="middle">6.000 mm (uzunluk)</text>
  <line x1="44" y1="640" x2="44" y2="530" stroke="#0b3d66" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="35" y="585" font-size="12" fill="#0b3d66" transform="rotate(-90 35 585)" text-anchor="middle">2.200 mm</text>

  <!-- ===== ALT NOT ===== -->
  <text x="40" y="700" font-size="12" fill="#6b7787">Sağlam çizgi: yakın (ön) elemanlar · Kesikli çizgi: uzak (arka) elemanlar · Çerçeve sacsız gösterilmiştir, kaynak noktaları ayrı çizimde verilir.</text>
</svg>
