  <text x="717" y="286" font-size="13" font-weight="700" fill="#0b3d66">TEKNİK ÖZELLİKLER</text>
  <text x="717" y="309" font-size="11.5" fill="#33415c">• Dış ölçüler: 6.000×2.500×2.200 mm</text>
  <text x="717" y="327" font-size="11.5" fill="#33415c">• Hacim: ~30 m³ · yük: 8–12 ton</text>
  <text x="717" y="345" font-size="11.5" fill="#33415c">• Taban: 5–8 mm sac + traversli</text>
  <text x="717" y="363" font-size="11.5" fill="#33415c">• Duvar: 3–5 mm sac + kolonlu</text>
  <text x="717" y="381" font-size="11.5" fill="#33415c">• Şase: I/kutu profil kızak rayı</text>
  <text x="717" y="399" font-size="11.5" fill="#33415c">• Üst: açık (kapak ops.) · Boya: kumlama+epoksi+PU</text>

